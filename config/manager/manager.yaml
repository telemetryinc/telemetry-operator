apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: telemetry-operator
  name: telemetry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-operator
  namespace: telemetry
  labels:
    app.kubernetes.io/name: telemetry-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-operator
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: operator
        image: ghcr.io/telemetryinc/telemetry-operator:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 64Mi
      serviceAccountName: telemetry-operator
      terminationGracePeriodSeconds: 10
